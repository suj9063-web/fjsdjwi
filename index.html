<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>大吉利車輪餅 | 線上訂購</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #fffbeb; color: #431407; margin: 0; padding: 15px; }
    .header { background: #7c2d12; color: #fff; padding: 15px 5px; text-align: center; border-radius: 12px; margin-bottom: 15px; }
    .header h1 { margin: 0; font-size: 22px; }
    .header p { margin: 5px 0 0; font-size: 13px; white-space: nowrap; }
    
    .info-card { background: #fff3c4; padding: 15px; border-radius: 10px; margin-bottom: 20px; line-height: 1.7; font-size: 15px; }
    .info-card .row { margin-bottom: 6px; }
    
    .section-title { font-size: 20px; font-weight: bold; margin: 20px 0 10px; }
    .grid { display: flex; flex-direction: column; gap: 10px; }
.card { background: #fff; border: 1px solid #fed7aa; border-radius: 10px; padding: 12px 15px; display: flex; align-items: center; justify-content: space-between; }

    .icon { font-size: 30px; }
    .price { color: #c2410c; font-weight: bold; margin: 5px 0; }
    .qty button { background: #ea580c; color: white; border: none; width: 28px; height: 28px; border-radius: 50%; font-size: 16px; cursor: pointer; }
    .qty span { margin: 0 8px; font-weight: bold; }
    
    .cart { background: #fff; border-radius: 10px; padding: 15px; margin-top: 20px; border: 1px solid #fed7aa; }
    .empty { color: #9a3412; }
    .total { font-size: 18px; font-weight: bold; margin: 10px 0; color: #7c2d12; }
    label { display: block; margin-top: 10px; font-weight: bold; font-size: 15px; }
    input, select, textarea { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 15px; }
    button.order { background: #15803d; color: white; border: none; width: 100%; padding: 12px; font-size: 16px; font-weight: bold; border-radius: 8px; margin-top: 15px; cursor: pointer; }
    footer { text-align: center; margin-top: 30px; font-size: 13px; color: #78350f; }
  </style>
</head>
<body>

  <div class="header">
    <h1><img src="481293.jpg" alt="車輪餅" style="width: 35px; vertical-align: middle;"> 大吉利車輪餅</h1>

    <p>現做現吃．外酥內餡．每日新鮮製作</p>
  </div>

  <div class="info-card">
    <div class="row">🔥 <b>今日推薦：紅豆、奶油、芋頭！</b><br>滿 10 顆可提前預訂。</div>
    <hr style="border: 0.5px solid #fbd5a5; margin: 8px 0;">
    <div class="row">🕒 營業時間：上午 11:00 - 下午 6:00</div>
    <div class="row">📍 地址：嘉義縣水上鄉寬士村11鄰崎仔頭28-103號</div>
    <div class="row">📞 電話：0916231224</div>
    <div class="row">🛵 外送服務：3公里以內可外送</div>
  </div>

  <div class="section-title">🍢 車輪餅口味</div>
  <div class="grid" id="products"></div>

  <div class="cart">
    <h2>🛒 我的訂單</h2>
    <div id="cartList" class="empty">尚未選擇商品</div>
    <div class="total">總計：$<span id="total">0</span></div>

    <label>姓名</label>
    <input id="name" placeholder="請輸入姓名">

    <label>電話</label>
    <input id="phone" placeholder="請輸入手機號碼">

    <label>取貨方式</label>
    <select id="pickup">
      <option>門市自取</option>
      <option>現場攤位取貨</option>
      <option>外送服務(限3公里以內)</option>
    </select>

    <label>備註</label>
    <input id="note" placeholder="例如：不要太甜、幾點取貨">


    <button class="order" onclick="submitOrder()">送出訂單</button>
  </div>

  <footer>
    <p>© 2026 大吉利車輪餅 | 預訂專線：0916-231-224</p>
  </footer>

  <script>
    const products = [
      { name: "紅豆車輪餅", price: 15, icon: "🫘" },
      { name: "奶油車輪餅", price: 15, icon: "🥛" },
      { name: "芋頭車輪餅", price: 20, icon: "🍠" },
      { name: "巧克力車輪餅", price: 25, icon: "🍫" },
      { name: "起司車輪餅", price: 27, icon: "🧀" }
    ];

    let cart = {};

    function renderProducts() {
      const container = document.getElementById("products");
      if (!container) return;
      container.innerHTML = products.map((p, i) => `
                <div class="card">
          <div style="display: flex; align-items: center; gap: 10px;">
            <span style="font-size: 26px;">${p.icon}</span>
            <div>
              <h3 style="margin: 0; font-size: 16px;">${p.name}</h3>
              <div class="price" style="margin: 2px 0 0; text-align: left;">$${p.price}</div>
            </div>
          </div>
          <div class="qty">
            <button onclick="change(${i},-1)">-</button>
            <span id="q${i}">0</span>
            <button onclick="change(${i},1)">+</button>
          </div>
        </div>

      `).join('');
    }

    function change(i, d) {
      cart[i] = Math.max(0, (cart[i] || 0) + d);
      const qEl = document.getElementById("q" + i);
      if (qEl) qEl.textContent = cart[i];
      renderCart();
    }

    function renderCart() {
      let items = [], total = 0;
      products.forEach((p, i) => {
        let q = cart[i] || 0;
        if (q) {
          items.push(`<div>${p.name} × ${q} ($${q * p.price})</div>`);
          total += q * p.price;
        }
      });
      const cartList = document.getElementById("cartList");
      const totalEl = document.getElementById("total");
      if (cartList) {
        cartList.innerHTML = items.length ? items.join("") : "尚未選擇商品";
        cartList.className = items.length ? "" : "empty";
      }
      if (totalEl) totalEl.textContent = total;
    }

    function submitOrder() {
      let lines = [], total = 0;
      products.forEach((p, i) => {
        let q = cart[i] || 0;
        if (q) {
          lines.push(`${p.name} × ${q}`);
          total += q * p.price;
        }
      });

      const name = document.getElementById("name").value.trim();
      const phone = document.getElementById("phone").value.trim();
      const pickup = document.getElementById("pickup").value;
      const note = document.getElementById("note").value.trim();

      if (!lines.length) return alert("請先選擇商品！");
      if (!name || !phone) return alert("請填寫姓名與電話！");

      const orderData = {
        name: name,
        phone: phone,
        items: `${lines.join(', ')} (總計: $${total})`,
        type: pickup,
        note: note
      };

      const GAS_URL = 'https://script.google.com/macros/s/AKfycbwpcR0k5AfX62PjyVcJ1LemFtMx6As0TMW-yXJ42zNYInN-sAagLIhF506uvh40D6tdzA/exec';

      fetch(GAS_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify(orderData)
      }).then(() => {
        alert(`訂單已成功送出！\n\n${lines.join("\n")}\n\n總計：$${total}`);
        cart = {};
        renderProducts();
        renderCart();
        document.getElementById("name").value = "";
        document.getElementById("phone").value = "";
        document.getElementById("note").value = "";
      }).catch(err => {
        alert("送出失敗，請再試一次！");
        console.error(err);
      });
    }

    renderProducts();
    renderCart();
  </script>
</body>
</html>

<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>大吉利車輪餅｜線上訂購</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;background:#fff8ef;color:#3b2418}
header{background:#8f3f20;color:#fff;padding:28px 18px;text-align:center}
header h1{margin:0 0 6px;font-size:30px}header p{margin:0;opacity:.9}
.wrap{max-width:900px;margin:auto;padding:18px}.notice{background:#fff1d8;border-radius:16px;padding:14px;margin-bottom:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
.card{background:#fff;border-radius:18px;padding:16px;box-shadow:0 4px 14px #0000000d;text-align:center}
.icon{background:#fff3df;border-radius:14px;padding:12px;display:flex;align-items:center;justify-content:center;height:100px}
.icon svg{width:70px;height:70px}
.card h3{margin:12px 0 5px}.price{font-weight:700;color:#a74420;font-size:19px}
button{border:0;border-radius:12px;padding:11px 15px;background:#b85a2b;color:#fff;font-weight:700;cursor:pointer}
.qty{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:10px}.qty button{padding:7px 11px}.qty span{min-width:25px;text-align:center;font-weight:700}
.cart{background:#fff;border-radius:18px;padding:18px;margin-top:22px;box-shadow:0 5px 20px #0002}
.total{font-size:22px;font-weight:800;margin:10px 0}
input,select,textarea{width:100%;padding:12px;border:1px solid #e0cfc2;border-radius:10px;margin:6px 0 10px;font:inherit}
.order{margin-top:12px;background:#3f7d3a}.empty{color:#876f62}
footer{text-align:center;padding:25px;color:#876f62}
</style>
</head>
<body>
<header><h1 style="display: flex; align-items: center; justify-content: center; gap: 8px;">
  <img src="480436.jpg" alt="車輪餅" style="height: 40px; width: auto; vertical-align: middle;">
  大吉利車輪餅
</h1>


<p>現做現吃・外酥內餡・每日新鮮製作</p></header>
<div class="wrap">
<div class="notice">🔥 今日推薦：紅豆、奶油、芋頭！滿 10 顆可提前預訂。3公里內提供外送服務!</div>
  <div>
  🕒 營業時間：上午 11:00 - 下午 6:00<br>
  📍  地址：嘉義縣水上鄉寬士村11鄰崎仔頭28-103號<br>
  📞 電話：0916231224<br>
  🛵 外送服務：3公里以內可外送<br>
 </div>

<h2>🍢 車輪餅口味</h2>
<div class="grid" id="products"></div>

<div class="cart">
<h2>🛒 我的訂單</h2>
<div id="cartList" class="empty">尚未選擇商品</div>
<div class="total">總計：$<span id="total">0</span></div>
<label>姓名</label><input id="name" placeholder="請輸入姓名">
<label>電話</label><input id="phone" placeholder="請輸入手機號碼">
<label>取貨方式</label>
<select id="pickup"><option>門市自取</option><option>現場攤位取貨</option><option>外送服務(限3公里以內)</option></select>
<label>備註</label><textarea id="note" rows="3" placeholder="例如：不要太甜、幾點取貨"></textarea>
<button class="order" onclick="submitOrder()">送出訂單</button>
</div>
</div>
<footer>© 2026 大吉利車輪餅｜本頁為示範訂購網站</footer>

<script>
const redBeanSvg = `<svg viewBox="0 0 100 100">
  <g fill="#7A221E" stroke="#3b2418" stroke-width="2">
    <ellipse cx="38" cy="40" rx="12" ry="8" transform="rotate(-20 38 40)"/>
    <ellipse cx="60" cy="38" rx="11" ry="7" transform="rotate(15 60 38)"/>
    <ellipse cx="48" cy="52" rx="13" ry="8" transform="rotate(-5 48 52)"/>
    <ellipse cx="30" cy="58" rx="10" ry="7" transform="rotate(25 30 58)"/>
    <ellipse cx="68" cy="55" rx="12" ry="8" transform="rotate(-30 68 55)"/>
    <ellipse cx="45" cy="68" rx="11" ry="7" transform="rotate(10 45 68)"/>
    <ellipse cx="58" cy="66" rx="10" ry="7" transform="rotate(-15 58 66)"/>
  </g>
</svg>`;

const milkSvg = `<svg viewBox="0 0 100 100">
  <path d="M30 25 L35 85 Q35 90 50 90 Q65 90 65 85 L70 25 Z" fill="#EBF4F6" stroke="#3b2418" stroke-width="3"/>
  <ellipse cx="50" cy="25" rx="20" ry="5" fill="#D2E0E6" stroke="#3b2418" stroke-width="3"/>
  <path d="M32 38 Q50 43 68 38 L66 83 Q50 88 34 83 Z" fill="#FFFFFF"/>
</svg>`;

const taroSvg = `<svg viewBox="0 0 100 100">
  <path d="M25 65 Q20 30 50 25 Q80 30 75 65 Q50 85 25 65 Z" fill="#CBB4D5" stroke="#3b2418" stroke-width="3"/>
  <path d="M30 62 Q25 35 50 30 Q75 35 70 62 Q50 80 30 62 Z" fill="#8E659A"/>
  <circle cx="42" cy="45" r="2" fill="#6A4175"/><circle cx="58" cy="50" r="2" fill="#6A4175"/>
</svg>`;

const chocSvg = `<svg viewBox="0 0 100 100">
  <rect x="30" y="20" width="40" height="60" rx="5" fill="#5C2C16" stroke="#3b2418" stroke-width="3"/>
  <rect x="30" y="50" width="40" height="30" rx="2" fill="#D32F2F" stroke="#3b2418" stroke-width="2"/>
  <line x1="30" y1="35" x2="70" y2="35" stroke="#3b2418" stroke-width="2"/>
  <line x1="50" y1="20" x2="50" y2="50" stroke="#3b2418" stroke-width="2"/>
</svg>`;

const cheeseSvg = `<svg viewBox="0 0 100 100">
  <path d="M20 70 L80 70 L75 35 L50 20 L20 70 Z" fill="#FBC02D" stroke="#3b2418" stroke-width="3"/>
  <circle cx="40" cy="55" r="6" fill="#F57F17"/>
  <circle cx="60" cy="50" r="4" fill="#F57F17"/>
  <circle cx="50" cy="62" r="3" fill="#F57F17"/>
</svg>`;

const products=[
{name:"紅豆車輪餅",price:15,icon:redBeanSvg},
{name:"奶油車輪餅",price:15,icon:milkSvg},
{name:"芋頭車輪餅",price:20,icon:taroSvg},
{name:"巧克力車輪餅",price:25,icon:chocSvg},
{name:"起司車輪餅",price:27,icon:cheeseSvg}
];

const cart={};
function renderProducts(){
 document.getElementById("products").innerHTML=products.map((p,i)=>`
 <div class="card">
   <div class="icon">${p.icon}</div>
   <h3>${p.name}</h3>
   <div class="price">$${p.price}</div>
   <div class="qty"><button onclick="change(${i},-1)">－</button><span id="q${i}">0</span><button onclick="change(${i},1)">＋</button></div>
 </div>`).join("");
}
function change(i,d){cart[i]=Math.max(0,(cart[i]||0)+d);document.getElementById("q"+i).textContent=cart[i];renderCart();}
function renderCart(){
 let items=[],total=0;
 products.forEach((p,i)=>{let q=cart[i]||0;if(q){let sub=q*p.price;total+=sub;items.push(`<div>${p.name} × ${q} $${sub}</div>`)}});
 document.getElementById("cartList").innerHTML=items.length?items.join(""):"尚未選擇商品";
 document.getElementById("cartList").className=items.length?"":"empty";
 document.getElementById("total").textContent=total;
}
function submitOrder(){
 let lines=[],total=0;
 products.forEach((p,i)=>{let q=cart[i]||0;if(q){lines.push(`${p.name} × ${q}`);total+=q*p.price}});
 const name=document.getElementById("name").value.trim();
 const phone=document.getElementById("phone").value.trim();
 if(!lines.length)return alert("請先選擇車輪餅！");
 if(!name||!phone)return alert("請填寫姓名與電話！");
 alert(`訂單已建立！\n\n${lines.join("\n")}\n\n總計：$${total}\n取貨：${document.getElementById("pickup").value}\n\n目前是示範版，尚未連接真正的訂單後台。`);
}
renderProducts();renderCart();
</script>
</body>
</html>
